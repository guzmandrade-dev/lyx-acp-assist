<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LyX ACP Assist</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <select id="doc-select" title="Active LyX document"></select>
    <button id="pin" class="pin" aria-pressed="false" title="Float on top while LyX is focused">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v7" />
        <path d="M5 9h14" />
        <path d="M8 9l-2 8h12l-2-8" />
        <path d="M12 17v4" />
        <path d="M9 21h6" />
      </svg>
    </button>
    <button id="reconnect" class="pin" title="Reconnect: restart the agent session and re-read LyX">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
    </button>
  </div>

  <div class="context">
    <div id="status" class="status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">checking LyX&hellip;</span>
      <span id="lyx-spinner" class="lyx-spinner" aria-hidden="true" hidden></span>
      <span id="lyx-busy-text" class="lyx-busy-text" hidden>talking to LyX&hellip;</span>
    </div>
    <div id="doc" class="doc" title=""></div>
    <div id="selection" class="selection" hidden></div>
    <details class="agent-settings">
      <summary>Agent settings</summary>
      <label>Command <input id="agent-cmd" type="text" value="opencode" /></label>
      <label>Args <input id="agent-args" type="text" value="acp" /></label>
      <div class="settings-row">
        <small>Examples: opencode acp &middot; copilot --acp &middot; goose acp</small>
      </div>
    </details>
  </div>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div id="chips" class="chips"></div>
    <textarea id="input" rows="3"
      placeholder="Ask the agent. It reads the document and your selection, then decides: reply here, insert at the cursor, or rewrite what you selected."></textarea>
    <div class="composer-hint">The agent chooses whether to write into LyX or just chat.</div>
    <div class="row">
      <button id="attach" title="Attach a file (PDF, Word, Excel, text&hellip;)" disabled>+</button>
      <button id="undo" title="Undo the last agent edit inside LyX">Undo edit</button>
      <button id="stop" title="Stop the running generation" hidden>Stop</button>
      <button id="send" title="Send message (Enter)">Send</button>
    </div>
    <input id="file-input" type="file" multiple hidden />
  </footer>

  <script src="app.js"></script>
</body>
</html>
