<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LyX ACP Assist</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <select id="doc-select" title="Active LyX document"></select>
    <button id="pin" class="pin" title="Float on top while LyX is focused (on)">&#128204;</button>
  </div>

  <div class="context">
    <div id="status" class="status">checking LyX&hellip;</div>
    <div id="doc" class="doc"></div>
    <details class="agent-settings">
      <summary>Agent settings</summary>
      <label>Command <input id="agent-cmd" type="text" value="opencode" /></label>
      <label>Args <input id="agent-args" type="text" value="acp" /></label>
      <div class="settings-row">
        <button id="reconnect">Reconnect</button>
        <small>Examples: opencode acp &middot; copilot --acp &middot; goose acp</small>
      </div>
    </details>
  </div>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div id="chips" class="chips"></div>
    <textarea id="input" rows="3"
      placeholder="Message the agent. It decides itself: reply in chat, insert at the cursor, or rewrite your selection."></textarea>
    <div class="row">
      <button id="attach" title="Attach a file (PDF, Word, Excel, text...)" disabled>+</button>
      <button id="undo" title="Undo the last agent edit inside LyX">Undo edit</button>
      <button id="stop" title="Stop the running generation" style="display:none">Stop</button>
      <button id="send">Send</button>
    </div>
    <input id="file-input" type="file" multiple style="display:none" />
  </footer>

  <script src="app.js"></script>
</body>
</html>
