<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LyX ACP Assist</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="titlebar">
    <div class="titlebar-left">
      <span class="title">LyX Assist</span>
      <select id="doc-select" title="Active LyX document"></select>
    </div>
    <div class="titlebar-right">
      <button id="pin" title="Toggle always on top">&#128204;</button>
      <button id="close" title="Close">&#10005;</button>
    </div>
  </header>

  <div class="context">
    <div id="status" class="status">checking LyX&hellip;</div>
    <div id="doc" class="doc"></div>
    <details class="agent-settings">
      <summary>Agent settings</summary>
      <label>Command <input id="agent-cmd" type="text" value="opencode" /></label>
      <label>Args <input id="agent-args" type="text" value="acp" /></label>
      <small>Examples: opencode acp &middot; copilot --acp &middot; goose acp</small>
    </details>
  </div>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="mode">
      <label><input type="radio" name="mode" value="chat" checked /> Chat</label>
      <label><input type="radio" name="mode" value="rewrite" /> Rewrite selection</label>
      <label><input type="radio" name="mode" value="insert" /> Insert at cursor</label>
    </div>
    <textarea id="input" rows="3"
      placeholder="Message the agent. In Rewrite/Insert modes the reply is applied to the LyX document."></textarea>
    <div class="row">
      <button id="undo" title="Undo the last agent edit inside LyX">Undo edit</button>
      <button id="send">Send</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
