name: Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  # Icons are generated from public/logo.svg by a Windows-only PowerShell
  # script (System.Drawing), so one Windows runner produces both
  # build/icon.ico (Windows installer/window) and build/icon-256.png
  # (mac/linux dock + window). Both are gitignored; the per-OS build jobs
  # download them from here before packaging.
  icons:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate app icons
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-icon.ps1

      - name: Upload icons
        uses: actions/upload-artifact@v4
        with:
          name: app-icons
          path: |
            build/icon.ico
            build/icon-256.png
          if-no-files-found: error

  build:
    needs: icons
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download app icons
        uses: actions/download-artifact@v4
        with:
          name: app-icons
          path: build

      - name: Build application
        run: npm run build

      - name: Package application
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist-release/*.dmg
            dist-release/*.zip
          if-no-files-found: warn

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.tar.gz
          if-no-files-found: warn

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist-release/*.exe
            dist-release/*.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
